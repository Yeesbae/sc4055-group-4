[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sc4055-vix-financial-model"
version = "3.0.0"
description = "Nine-state VIX financial model and exact classical inference for SC4055"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
